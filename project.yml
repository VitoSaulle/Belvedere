name: Belvedere
options:
  bundleIdPrefix: it.vitosaulle
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  BelvedereCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Belvedere:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: BelvedereCore
        product: BelvedereCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.vitosaulle.Belvedere
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Cartella degli helper compilati con SwiftPM (release.sh la passa per la build universale).
        HELPERS_DIR: $(SRCROOT)/.build/release
        # Le release le sovrascrivono: la versione viene dal tag (v0.2.0 → 0.2.0), la build dal numero dell'esecuzione.
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        # Aggiornamenti con Sparkle: chiave pubblica EdDSA (generate_keys). Vuota = aggiornamenti spenti.
        SPARKLE_PUBLIC_KEY: ""
      configs:
        # Distribuzione fuori dallo Store: firma del team, hardened runtime per la notarizzazione.
        Release:
          DEVELOPMENT_TEAM: 94BHT7B4R9
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Helper
        basedOnDependencyAnalysis: false
        script: |
          set -e
          D="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$D"
          for h in belvedere-hook belvedere-statusline; do
            cp "$HELPERS_DIR/$h" "$D/$h"
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" -o runtime "$D/$h"
          done
schemes:
  Belvedere:
    build:
      targets:
        Belvedere: all
