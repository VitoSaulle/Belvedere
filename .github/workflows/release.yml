# Un tag vX.Y.Z su main: build universale, firma Developer ID, notarizzazione, DMG allegato alla Release.
# Segreti del repo (li imposta il proprietario, non compaiono mai nei log):
#   ASC_KEY_ID, ASC_ISSUER_ID  – chiave API di App Store Connect, ruolo Admin
#   ASC_KEY_P8                 – contenuto del file AuthKey_<id>.p8
#   SPARKLE_ED_PRIVATE_KEY     – chiave privata EdDSA di Sparkle (generate_keys -x); la pubblica è in project.yml
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Il tag è su main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: XcodeGen
        run: brew install xcodegen
      - name: Test
        run: scripts/t.sh
      - name: Chiavi
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] && printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key" || echo "::warning::SPARKLE_ED_PRIVATE_KEY assente: release senza aggiornamenti automatici"
      - name: Firma, notarizzazione e DMG
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          SPARKLE_KEY_FILE: ${{ runner.temp }}/sparkle.key
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export VERSION="${VERSION#v}"
          scripts/release.sh
      - name: Log in caso di errore
        if: failure()
        run: tail -60 .superpowers/release-last.log | grep -v -i -E "authenticationKey|AuthKey|ed-key-file" || true
      - name: Release su GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- build/release/Belvedere-*.dmg
          [ -f build/release/appcast.xml ] && set -- "$@" build/release/appcast.xml
          gh release create "$GITHUB_REF_NAME" "$@" \
            --title "Belvedere ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
      - name: Via la chiave
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle.key"
