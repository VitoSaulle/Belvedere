# Un tag vX.Y.Z su main: build universale, firma Developer ID, notarizzazione, DMG allegato alla Release.
# Segreti del repo (li imposta il proprietario, non compaiono mai nei log):
#   ASC_KEY_ID, ASC_ISSUER_ID  – chiave API di App Store Connect, ruolo Admin
#   ASC_KEY_P8                 – contenuto del file AuthKey_<id>.p8
#   SPARKLE_ED_PRIVATE_KEY     – chiave privata EdDSA di Sparkle (generate_keys -x); la pubblica è in project.yml
#   DEVELOPER_ID_P12           – certificato «Developer ID Application» con chiave privata, .p12 in base64
#   DEVELOPER_ID_P12_PASSWORD  – password del .p12
# La chiave API serve alla notarizzazione: il certificato Developer ID gestito nel cloud non si usa da CI.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Il tag è su main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: XcodeGen
        run: brew install xcodegen
      - name: Test
        run: scripts/t.sh
      - name: Chiavi
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] && printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key" || echo "::warning::SPARKLE_ED_PRIVATE_KEY assente: release senza aggiornamenti automatici"
      - name: Certificato Developer ID
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/firma.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Developer ID Application"
      - name: Firma, notarizzazione e DMG
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          SPARKLE_KEY_FILE: ${{ runner.temp }}/sparkle.key
          SIGNING_STYLE: manual
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${VERSION#v}"
          # Sparkle confronta CFBundleVersion: le build locali hanno 1, le release partono da 101.
          export BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))
          scripts/release.sh
      - name: Log in caso di errore
        if: failure()
        run: tail -60 .superpowers/release-last.log | grep -v -i -E "authenticationKey|AuthKey|ed-key-file" || true
      - name: Release su GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- build/release/Belvedere-*.dmg
          [ -f build/release/appcast.xml ] && set -- "$@" build/release/appcast.xml
          gh release create "$GITHUB_REF_NAME" "$@" \
            --title "Belvedere ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
      - name: Via la chiave
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle.key" "$RUNNER_TEMP/devid.p12"
          security delete-keychain "$RUNNER_TEMP/firma.keychain-db" 2>/dev/null || true
