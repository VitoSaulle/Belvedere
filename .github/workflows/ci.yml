# Ogni pull request e ogni push su main: test del core e build dell'app (firma ad-hoc, nessun segreto).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: XcodeGen
        run: brew install xcodegen
      - name: Test
        run: scripts/t.sh
      - name: Build
        run: scripts/build-app.sh
